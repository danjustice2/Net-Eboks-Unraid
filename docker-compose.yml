services:
  net-eboks:
    image: net-eboks:latest
    build:
      context: .
    container_name: Net-Eboks
    restart: unless-stopped
    ports:
      - "8110:8110"   # POP3 proxy (used in pop3 mode)
      - "9999:9999"   # MitID auth web UI (used in auth mode only)
    environment:
      # Set to "auth" for the one-time MitID setup, then back to "pop3"
      # Set to "dump" to write new messages to a directory (e.g. Paperless-ngx)
      EBOKS_MODE: pop3
      EBOKS_POP3_PORT: "8110"
      EBOKS_POP3_ADDR: "0.0.0.0"
      EBOKS_DEBUG: "0"
      # Uncomment to override the From: address on generated mails:
      # MAILFROM: "your@email.com"

      # ── dump mode settings ─────────────────────────────────────────────────
      # Required when EBOKS_MODE=dump:
      # EBOKS_CPR: "1234567890"        # CPR number without dash
      # EBOKS_PASSWORD: "secret"       # e-Boks mobile password
      # EBOKS_DUMP_DIR: /consume       # directory to write .eml files into
      # EBOKS_DUMP_INTERVAL: "3600"    # poll every N seconds; 0 = run once and exit
      #
      # Note: with EBOKS_DUMP_INTERVAL=0 and restart: unless-stopped, Docker will
      # restart the container after each run, effectively polling on Docker's restart
      # back-off schedule. Set a non-zero interval to control the poll rate instead.

    # Mount your Paperless-ngx consume directory (or any watch directory) here.
    # Adjust the host path to match your setup:
    # volumes:
    #   - /path/to/paperless/consume:/consume
